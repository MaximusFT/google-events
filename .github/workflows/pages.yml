name: Publish documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check library and package
        run: npm run check
      - name: Check documentation in root and relocated paths
        run: npm run docs:check
      - name: Read GitHub Pages address
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for the configured Pages path
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked documentation
        id: deployment
        uses: actions/deploy-pages@v5
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the published URL
        env:
          DOCS_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --config playwright.docs.config.mjs
