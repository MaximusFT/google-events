<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пилот интеграции · DOM-события</title>
  <style>
    body { max-width: 1100px; margin: 32px auto; padding: 0 20px; font: 16px/1.5 system-ui; color: #202630; }
    section, .controls { border: 1px solid #cbd5df; border-radius: 12px; padding: 20px; margin: 20px 0; }
    label { display: inline-block; margin: 8px 16px 8px 0; }
    button, input:not([type=checkbox]), select { font: inherit; padding: 8px 12px; }
    button { cursor: pointer; margin: 6px 8px 6px 0; }
    button:disabled { cursor: wait; }
    .outputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    pre { background: #17212b; color: #c9e9df; padding: 18px; border-radius: 8px; overflow: auto; max-height: 600px; font-size: 13px; }
    .overlay { position: fixed; inset: 0; background: #17212bbf; display: grid; place-items: center; padding: 24px; }
    .overlay section { background: white; width: min(640px, 90vw); }
  </style>
</head>
<body><div id="pilot-root"></div><script type="module" src="/examples/pilot/main.tsx"></script></body>
</html>
